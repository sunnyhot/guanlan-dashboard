name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Swift package
        run: swift build --package-path macos-app

      - name: Run Swift tests
        working-directory: macos-app
        run: |
          # runner 默认 bash -e：swift test 失败即退出步骤，摘录代码不可达。
          # 显式关闭 -e 捕获退出码后再走摘录与评论。
          set +e
          swift test 2>&1 | tee /tmp/test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## 失败的测试（自动摘录）"
              grep -E "error: -\[|failed \([0-9]" /tmp/test-output.log | head -40 || echo "（无 XCTest 失败行——可能是编译/崩溃，见下方日志尾）"
            } >> "$GITHUB_STEP_SUMMARY"
            # 失败摘录 + 日志尾评论到 commit（公开可读，便于无登录排查）
            {
              grep -E "error: -\[|failed \([0-9]" /tmp/test-output.log | head -20 || true
              echo ""
              echo "—— 日志尾 100 行 ——"
              tail -100 /tmp/test-output.log
            } > /tmp/failures.txt
            BODY=$(jq -Rs '{body: .}' < /tmp/failures.txt)
            curl -s -f -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d "$BODY" || echo "评论失败（忽略）"
            exit "$status"
          fi

      - name: Build native Qieman CLI
        run: bash scripts/build_qieman_cli.sh

      - name: Smoke test native Qieman CLI
        run: scripts/qieman version
