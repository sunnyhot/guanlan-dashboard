name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Swift package
        run: swift build --package-path macos-app

      - name: Run Swift tests
        working-directory: macos-app
        run: |
          # runner 默认 bash -e：swift test 失败即退出步骤，摘录代码不可达。
          # 显式关闭 -e 捕获退出码后再走摘录与评论。
          set +e
          swift test 2>&1 | tee /tmp/test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## 失败的测试（自动摘录）"
              grep -E "error: -\[|failed \([0-9]" /tmp/test-output.log | head -40 || echo "（无 XCTest 失败行——可能是编译/崩溃，见下方日志尾）"
            } >> "$GITHUB_STEP_SUMMARY"
            # 失败摘录 + 日志尾发到诊断 issue（公开可读；commit 评论对
            # GITHUB_TOKEN 常被 403，issue 是可靠通道）
            {
              echo "== 编译/测试错误行 =="
              grep -E ": error:|error: -\[" /tmp/test-output.log | grep -v "warning" | head -40 || echo "（无 error 行）"
              echo ""
              echo "== error 首现处上下文 =="
              grep -n -m1 ": error:" /tmp/test-output.log | cut -d: -f1 | xargs -I{} sh -c 'sed -n "$(({}-15)),$(({}+25))p" /tmp/test-output.log' || true
              echo ""
              echo "—— 日志尾 60 行 ——"
              tail -60 /tmp/test-output.log
            } > /tmp/failures.txt
            BODY=$(jq -Rs --arg title "CI 失败诊断 ${{ github.sha }}" \
              '{title: $title, body: .}' < /tmp/failures.txt)
            curl -s -f -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$BODY" || echo "issue 创建失败（忽略）"
            exit "$status"
          fi

      - name: Build native Qieman CLI
        run: bash scripts/build_qieman_cli.sh

      - name: Smoke test native Qieman CLI
        run: scripts/qieman version
