name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # tag: v2.4.0 → version: 2.4.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        id: signing
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: |
          # 稳定自签名身份：让每次构建满足同一 designated requirement，
          # 避免 App 更新后读取 Keychain 密钥反复弹授权窗。
          # secrets 未配置时回退 ad-hoc，保证构建不中断。
          if [ -z "$MACOS_CODESIGN_P12_BASE64" ] || [ -z "$MACOS_CODESIGN_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 MACOS_CODESIGN_* secrets，回退 ad-hoc 签名"
            exit 0
          fi
          # 布置成与本地 scripts/create_signing_identity.sh 相同的 build/signing/ 结构，
          # 由 build_macos_app.sh 的自动检测块统一解锁/挂载/签名（本地已验证路径；
          # CI 直接调 codesign 会在 headless 下等 SecurityAgent 授权挂起）。
          SIGNING_DIR="$GITHUB_WORKSPACE/build/signing"
          KEYCHAIN_PATH="$SIGNING_DIR/qieman-signing.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/qieman-codesign.p12"
          CRT_PATH="$RUNNER_TEMP/qieman-codesign.crt"
          printf '%s' "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          # 自签名证书需信任设置，否则 codesign 报 no identity found。
          # 用户域 add-trusted-cert 会等 GUI 授权（卡死实证），走 sudo + admin 域，
          # 并套超时兜底，任何一步挂起都回退 ad-hoc。
          run_with_timeout() {
            local secs=$1; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local wd=$!
            wait "$pid"; local rc=$?
            kill "$wd" 2>/dev/null; wait "$wd" 2>/dev/null || true
            return $rc
          }
          openssl pkcs12 -in "$CERT_PATH" -nokeys -clcerts -passin pass:"$MACOS_CODESIGN_PASSWORD" -out "$CRT_PATH"
          if ! run_with_timeout 120 sudo security add-trusted-cert -d -r trustRoot -p codeSign "$CRT_PATH"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ add-trusted-cert 失败/超时，回退 ad-hoc 签名"
            exit 0
          fi
          printf 'QIEMAN_SIGNING_KEYCHAIN_PASS=%s\nQIEMAN_SIGNING_P12_PASS=%s\n' \
            "$KEYCHAIN_PASS" "$MACOS_CODESIGN_PASSWORD" > "$SIGNING_DIR/env"
          rm -f "$CERT_PATH" "$CRT_PATH"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS App
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCH: arm64
        run: |
          # 不传 SIGN_IDENTITY：build_macos_app.sh 自动检测 build/signing/ 并用稳定身份
          bash scripts/build_macos_app.sh

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain "$GITHUB_WORKSPACE/build/signing/qieman-signing.keychain-db" 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/build/signing"

      - name: Generate release notes
        id: notes
        run: |
          # 提取上一个 tag 到当前 tag 之间的 commit log
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | awk -v tag="$TAG" '$0 != tag { print; exit }')

          if [ -n "$PREV_TAG" ]; then
            RAW_COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges --invert-grep --grep='^release: update ')
          else
            RAW_COMMITS=$(git log -10 --pretty=format:"%s" --no-merges --invert-grep --grep='^release: update ')
          fi

          export RAW_COMMITS
          NOTES=$(swift scripts/release_notes.swift)

          if [ -z "$NOTES" ]; then
            NOTES="本次发布仅更新构建资产。"
          fi

          # 写入多行 output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "app_notes<<$EOF"
            echo "$NOTES"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

          BULLETS=$(printf '%s\n' "$NOTES" | sed 's/^/- /')

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            echo "## 观澜 ${{ steps.version.outputs.tag }}"
            echo ""
            echo "$BULLETS"
            echo ""
            echo "---"
            echo "🤖 自动构建 by GitHub Actions"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute sha256 and generate latest.json
        id: manifest
        env:
          BODY: ${{ steps.notes.outputs.app_notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="QiemanDashboard-${VERSION}.zip"
          ZIP_PATH="/tmp/${ZIP_NAME}"
          ZIP_SIZE=$(stat -f%z "$ZIP_PATH")
          SHA256=$(shasum -a 256 "$ZIP_PATH" | cut -d' ' -f1)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          export TAG VERSION ZIP_NAME ZIP_SIZE SHA256 DOWNLOAD_URL RELEASE_URL BODY
          swift scripts/release_manifest.swift /tmp/latest.json --published-now

          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 观澜 ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            /tmp/QiemanDashboard-${{ steps.version.outputs.version }}.zip
            /tmp/latest.json

      - name: Update latest.json on main branch
        env:
          BODY: ${{ steps.notes.outputs.app_notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="QiemanDashboard-${VERSION}.zip"
          ZIP_PATH="/tmp/${ZIP_NAME}"
          ZIP_SIZE=$(stat -f%z "$ZIP_PATH")
          SHA256="${{ steps.manifest.outputs.sha256 }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          git fetch origin main
          git switch -C main origin/main

          export TAG VERSION ZIP_NAME ZIP_SIZE SHA256 DOWNLOAD_URL RELEASE_URL BODY
          swift scripts/release_manifest.swift releases/macos/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/macos/latest.json
          git diff --cached --quiet || git commit -m "release: update ${TAG}"
          git push origin HEAD:main
